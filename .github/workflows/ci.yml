name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check out dev-harness for the command drift test
        run: git clone --depth 1 https://github.com/danielmalka/dev-harness.git "$RUNNER_TEMP/dev-harness"
      - run: npm test
        env:
          DH_REPO: ${{ runner.temp }}/dev-harness
      - name: Committed .vsix matches the package version
        run: test "$(ls dist/*.vsix)" = "dist/dev-harness-$(node -p 'require("./package.json").version').vsix"
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "dist/*.vsix"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the committed .vsix
        run: test -f "dist/dev-harness-${GITHUB_REF_NAME#v}.vsix"
      - run: gh release create "$GITHUB_REF_NAME" dist/*.vsix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
